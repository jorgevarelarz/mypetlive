services:
  mongo:
    image: mongo:6
    container_name: mypetlive_mongo
    # replica set de un nodo: las transacciones (tienda, Patitas) lo exigen
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [mypetlive]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mypetlive_api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # Señal explícita de producción: NODE_ENV se queda en development por los mocks,
      # pero los bypasses de verificación (ALLOW_UNVERIFIED, /dev/verify) miran APP_ENV.
      APP_ENV: production
      PORT: "3000"
      MONGO_URI: "mongodb://mongo:27017/mypetlive?replicaSet=rs0"
      JWT_SECRET: "${JWT_SECRET}"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_SUBJECT: "${VAPID_SUBJECT}"
      ESCROW_DRIVER: mock
      SIGN_PROVIDER: mock
      SMS_PROVIDER: mock
      # Email transaccional vía Postfix de Plesk (recuperación de contraseña, etc.)
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_TLS_REJECT_UNAUTHORIZED: "${SMTP_TLS_REJECT_UNAUTHORIZED}"
      FRONTEND_URL: "${FRONTEND_URL}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      DONATION_FEE_PERCENT: "${DONATION_FEE_PERCENT}"
      # Topes de importe (utils/limits.ts). Sin valor caen a los defaults del
      # código: 1 €/2.000 € por donación y 3.000 € por venta.
      DONATION_MIN_EUR: "${DONATION_MIN_EUR}"
      DONATION_MAX_EUR: "${DONATION_MAX_EUR}"
      SALE_MAX_EUR: "${SALE_MAX_EUR}"
      PATITA_VALUE_EUR: "${PATITA_VALUE_EUR}"
      VISIT_PATITAS_REWARD: "${VISIT_PATITAS_REWARD}"
      COUPON_PATITAS_REWARD_DEFAULT: "${COUPON_PATITAS_REWARD_DEFAULT}"
    # Las fotos subidas (uploads) viven en el host: sin este volumen se pierden
    # cada vez que se recrea el contenedor.
    volumes:
      - ./uploads:/app/uploads
    # Mapea el hostname del cert de mail al host para que el contenedor alcance
    # el Postfix de Plesk a través del gateway de la red Docker.
    extra_hosts:
      - "panel.valerisstudio.es:host-gateway"
    # Solo accesible desde el host: Apache (Plesk) hace de proxy inverso a
    # 127.0.0.1:3000 (ver vhost.conf). Publicar en 0.0.0.0 exponía la API en
    # HTTP plano a internet saltándose el firewall de Plesk (Docker inserta su
    # propio DNAT por debajo del INPUT DROP), y con trust proxy=1 permitía
    # falsear X-Forwarded-For y anular el rate-limit.
    ports:
      - "127.0.0.1:3000:3000"
    networks: [mypetlive]

  # El contenedor `web` (mypetlive_web) servía un build viejo del frontend en
  # 0.0.0.0:8080. Está obsoleto: el frontend en producción se sirve desde el
  # docroot de Plesk (/var/www/vhosts/mypetlive.es/httpdocs), no desde aquí.

networks:
  mypetlive:

volumes:
  mongo_data:
