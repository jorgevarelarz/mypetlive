# App «MyPetLive» para iOS (copiado del flujo de Cuadra/Séllame).
#  - Cada push que toca frontend/ios o frontend/src: compila para el simulador, sin firmar.
#  - Push de una etiqueta ios-* (o lanzado a mano desde main): firma, archiva y sube a TestFlight.
#    git tag ios-1.0-b1 && git push mypetlive ios-1.0-b1
# Secretos (los carga ~/bin/apple-ci-secrets): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64,
# DIST_CERT_ID, DIST_P12_BASE64, DIST_P12_PASSWORD.
# La app lleva la web dentro (build con REACT_APP_API_URL=https://mypetlive.es): un cambio de pantallas
# necesita build nueva; el servidor se actualiza aparte.
name: iOS

on:
  push:
    branches: ["**"]
    tags: ["ios-*"]
    paths: ["frontend/ios/**", "frontend/src/**", "frontend/public/**", "frontend/capacitor.config.json", "frontend/package.json", "frontend/package-lock.json", "frontend/tsconfig.json", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Firmar y subir a TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTFLIGHT: ${{ startsWith(github.ref, 'refs/tags/ios-') || (github.event_name == 'workflow_dispatch' && inputs.testflight) }}

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
      # CI=false: react-scripts trata los avisos de ESLint como errores si CI=true
      - run: REACT_APP_API_URL=https://mypetlive.es CI=false npx react-scripts build && npx cap sync ios

      - name: Compilar para el simulador (sin firmar)
        if: env.TESTFLIGHT != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          test "${PIPESTATUS[0]}" -eq 0

      - name: Clave de App Store Connect
        if: env.TESTFLIGHT == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Certificado de distribución y perfil de App Store
        if: env.TESTFLIGHT == 'true'
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_CERT_ID: ${{ secrets.DIST_CERT_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KC="$RUNNER_TEMP/firma.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" BUNDLE_ID=es.mypetlive.app \
            PROFILE_NAME="es.mypetlive.app AppStore CI" node ios/ci/profile.mjs

      - name: Archivar y subir a TestFlight
        if: env.TESTFLIGHT == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -40
          sed "s/__TEAM_ID__/$TEAM_ID/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Subida a App Store Connect: build ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
